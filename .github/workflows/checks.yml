name: Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run lint
      - run: pnpm run build
      - run: python3 tests/inventory.py
      - name: Test API against local D1
        run: |
          ADMIN_PASSWORD=test-bootstrap-password DB_SEED=true pnpm exec next dev --webpack -p 43219 > /tmp/delvin-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          python3 tests/api.py || { cat /tmp/delvin-test-server.log; exit 1; }
